  <!-- maskable：背景铺满，图形收在中间 60% 的安全区里（安卓会按形状裁切） -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD9A0"/>
      <stop offset="1" stop-color="#F2A65A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <text x="256" y="268" font-size="230" text-anchor="middle" dominant-baseline="central">🎒</text>
</svg>
