<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 母品牌名是临时占位，最终叫什么见 docs/多学科平台架构设计.md 第 10 节（待决策） -->
<title>萌学园 · 一站式小学学习乐园</title>
<meta name="description" content="给小学生的一站式学习乐园：编程、英语、数学、拼音、语文、打字。每天一点，看得见进步。">
<meta name="theme-color" content="#F8F5F1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%92%3C/text%3E%3C/svg%3E">

<!-- 平台层样式：全站唯一一份，学科只覆盖 --accent 三个变量 -->
<link rel="stylesheet" href="/shared/styles/tokens.css?v=f0d21dc8">
<link rel="stylesheet" href="/shared/styles/base.css?v=7c284c2b">
<link rel="stylesheet" href="/shared/styles/components.css?v=15b61969">
<link rel="stylesheet" href="/shared/styles/chrome.css?v=a70f5710">
<!-- 装到手机主屏（PWA）：一个站一个图标，离线也能打开 -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>

<a class="skip-link" href="#lobby">跳到学科列表</a>

<div class="page">

  <!-- 大厅自己就是「家」，所以没有「← 大厅」；其余长得和学科页顶栏一样。
       topbar--keep-name：大厅窄屏也保留「萌学园」这个名字（学科页会省略，
       因为它们右侧还有按钮，名字会让顶栏换行挤烂）。 -->
  <header class="topbar topbar--keep-name">
    <span class="topbar-brand">
      <span class="tb-emoji" aria-hidden="true">🎒</span>
      <span class="tb-name">萌学园</span>
    </span>
    <span class="topbar-spacer"></span>
    <span class="topbar-actions">
      <!-- 家长中心：各科进度、连续打卡、需要多练的、可打印 A4 周报 -->
      <a class="btn ghost sm" href="/parent/" id="parentLink">👨‍👩‍👧 家长中心</a>
    </span>
    <!-- 设置：账号与同步是全域的东西，放在大厅最顺手 -->
    <span class="topbar-settings">
      <button type="button" class="topbar-gear" id="topbarGear"
              aria-haspopup="true" aria-expanded="false" aria-label="设置" title="设置">
        <span aria-hidden="true">⚙️</span>
      </button>
      <div class="settings-menu" id="topbarMenu" role="menu" hidden>
        <button type="button" class="settings-item" role="menuitem" id="btnAccount">
          <span class="sm-ico" aria-hidden="true">☁️</span>
          <span class="sm-label">账号与云同步</span>
          <span class="sm-note" id="accNote"></span>
        </button>
      </div>
    </span>
  </header>

  <main class="page-body">

    <section class="lobby-hero">
      <h1>今天想学点什么？</h1>
      <p>挑一个进去就行。学过的会记住，下次回来接着上次的地方。</p>
    </section>

    <!-- 跨学科复习：记忆盒里有到期卡片时才出现（由下面的脚本控制显示）。
         它把数学错题、英语错词放在同一个队列里，按到期时间过 ——
         没有这一条，几个学科就只是几个互不相干的网站。 -->
    <a class="resume" id="reviewEntry" href="/review/" hidden>
      <span class="resume-emoji" aria-hidden="true">🔁</span>
      <span class="resume-text">
        <span class="resume-label" id="reviewLabel">今天有卡片到期</span>
        <span class="resume-name">复习一下</span>
      </span>
      <span class="resume-go">开始 →</span>
    </a>

    <!-- 学科卡片由 shared/core/registry.js 依据 shared/subjects.js 渲染 -->
    <div id="lobby">
      <div class="note">正在加载学科…</div>
    </div>

    <!-- 今天各学科做什么（F5）：五个学科的每日任务并排放到一屏。
         由下面的脚本在学科 manifest 都加载完之后渲染 —— 任务池是学科声明里的。 -->
    <section id="today" hidden></section>

    <noscript>
      <div class="note" style="margin-top:24px">
        <strong>这个页面需要 JavaScript。</strong>
        没有 JavaScript 也能直接进各个学科：
        <a href="/python/">萌码 Python</a> ·
        <a href="/en/">萌语岛</a>
      </div>
    </noscript>

  </main>

  <footer class="page-foot">
    <p>送给爱琢磨的小朋友 · 数据都存在你自己的设备上，不收集姓名和手机号</p>
  </footer>

</div>

<!-- 平台层：存储 → 注册表 → 学科清单 → 启动
     存储层要先加载：学科 manifest 的 summary() 要靠它读本学科进度，
     好在卡片上显示"经验 N"。（老站两个 manifest 读的是自己的历史键
     codepanda_* / en_*，不走 Store，那是历史包袱，见 docs 的多学科设计。） -->
<script src="/shared/core/store.js?v=873bc876"></script>
<script src="/shared/core/srs.js?v=d4b0684f"></script>
<script src="/shared/core/progress.js?v=9269c173"></script>
<script src="/shared/core/topbar.js?v=e382f937"></script>
<script src="/shared/core/account-ui.js?v=74e0317f"></script>
<script src="/shared/core/registry.js?v=5065a79c"></script>
<script src="/shared/subjects.js?v=eada93fb"></script>
<script>
(function () {
  "use strict";

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // ---- 设置菜单 + 账号与云同步 ----
  // 账号面板是全平台共用的一份（AccountUI）：一次登录，Python / 英语 / 打字
  // 三个学科都会拿到同一个同步码。这里只需要接上入口。
  if (window.Topbar && Topbar.bindMenu) {
    Topbar.bindMenu(document.getElementById("topbarGear"), document.getElementById("topbarMenu"));
  }
  var btnAccount = document.getElementById("btnAccount");
  if (btnAccount && window.AccountUI) {
    btnAccount.addEventListener("click", function () { AccountUI.open(); });
    var st = AccountUI.status();
    var note = document.getElementById("accNote");
    if (note) note.textContent = st.loggedIn ? "已登录" : "未开启";
  }

  // ---- 跨学科复习入口 ----
  // 记忆盒里有到期卡片才显示。数学错题、英语错词都往里放，
  // 所以这里的数字是**所有学科加起来**今天要复习的量。
  (function () {
    if (typeof SRS === "undefined" || !SRS.stats) return;
    var st = SRS.stats();
    if (!st.due) return;
    var el = document.getElementById("reviewEntry");
    if (!el) return;
    var lab = document.getElementById("reviewLabel");
    if (lab) {
      var subs = Object.keys(st.bySubject || {}).filter(function (k) {
        return st.bySubject[k].due > 0;
      });
      lab.textContent = "今天有 " + st.due + " 张卡到期" +
        (subs.length > 1 ? "（来自 " + subs.length + " 个学科）" : "");
    }
    el.hidden = false;
  })();

  // 家长中心已经做好了（F2）：各科进度、连续打卡、需要多练的、可打印周报。
  // 这里不再拦点击 —— 之前那个「还在建设中」的 alert 已经过时了。

  // ---- 今天各学科做什么（F5）----
  // 各学科的每日任务由各自声明，这里只把它们**并排放到一屏**。
  //   · 打字 / 数学 / 汉字 / 拼音：走平台内核，能读到今天具体是哪三条
  //   · 英语：任务池**已经并进平台契约** —— 它把池子和"今天挑哪三条"的规则
  //     挂在 /en/subject.js 的 window.EN_DAILY 上（大厅本来就会加载各学科
  //     manifest），所以也能读到具体三条和各自的进度。规则只有那一份实现。
  //   · Python：任务池还在自己的 js/learn.js 里（大厅不加载那个文件），
  //     也没有声明给平台，所以只报事实：今天完成了几条。
  //     **不要在大厅里抄一份 Python 的任务池** —— 抄了迟早漂移。
  function renderToday() {
    var host = document.getElementById("today");
    if (!host || typeof Progress === "undefined" || !Progress.peek) return;
    var list = (window.Platform && Platform.all) ? Platform.all() : [];
    var rows = [], doneAll = 0, totalAll = 0;

    list.forEach(function (m) {
      if (!m.ready) return;
      var legacy = (m.id === "python" || m.id === "en");
      var p = legacy ? Progress.peekLegacy(m.id) : Progress.peek(m.id);
      if (!p) return;

      var inner;
      if (p.daily && p.daily.length) {
        doneAll += p.dailyDone; totalAll += p.dailyTotal;
        inner = p.daily.map(function (t) {
          return '<span class="today-task' + (t.done ? " done" : "") + '">' +
            '<span class="tt-e" aria-hidden="true">' + (t.done ? "✅" : (t.emoji || "•")) + "</span>" +
            '<span class="tt-t">' + esc(t.title) + "</span>" +
            '<b class="tt-n">' + t.cur + "/" + t.need + "</b></span>";
        }).join("");
      } else if (p.dailyTotal) {           // Python：能读到今天完成了几条
        doneAll += p.dailyDone; totalAll += p.dailyTotal;
        inner = '<span class="today-task' + (p.visitedToday ? " done" : "") + '">' +
          '<span class="tt-e" aria-hidden="true">' + (p.visitedToday ? "✅" : "•") + "</span>" +
          '<span class="tt-t">今天练过了</span>' +
          '<b class="tt-n">' + p.dailyDone + "/" + p.dailyTotal + "</b></span>";
      } else {                              // 英语：只知道今天来没来过
        inner = '<span class="today-task' + (p.visitedToday ? " done" : "") + '">' +
          '<span class="tt-e" aria-hidden="true">' + (p.visitedToday ? "✅" : "•") + "</span>" +
          '<span class="tt-t">' + (p.visitedToday ? "今天练过了" : "今天还没开始") + "</span></span>";
      }

      rows.push('<a class="today-row" href="' + esc(m.url) + '" data-subject="' + esc(m.id) +
        '" style="--accent:' + esc(m.accent) + '">' +
        '<span class="today-head">' +
          '<span class="today-emoji" aria-hidden="true">' + esc(m.emoji) + "</span>" +
          '<span class="today-name">' + esc(m.name) + "</span>" +
          (p.dailyTotal ? '<span class="today-count">' + p.dailyDone + "/" + p.dailyTotal + "</span>" : "") +
        "</span>" +
        '<span class="today-tasks">' + inner + "</span>" +
        ((p.xp > 0 || p.streak > 0)
          ? '<span class="today-meta">Lv.' + p.level +
            (p.streak > 0 ? ' · <span class="tm-fire">🔥 ' + p.streak + " 天</span>" : "") + "</span>"
          : "") +
        '<span class="today-go" aria-hidden="true">进去 →</span>' +
        "</a>");
    });

    if (!rows.length) return;
    host.innerHTML =
      '<h2 class="section-title">今天各学科做什么' +
        '<span class="st-sub">' +
        (totalAll ? "已完成 " + doneAll + " / " + totalAll + " 条 · " : "") +
        "每天自动换</span></h2>" +
      '<div class="today-list">' + rows.join("") + "</div>";
    host.hidden = false;
  }

  if (typeof Platform === "undefined" || !Platform.boot) {
    document.getElementById("lobby").innerHTML =
      '<div class="note">平台脚本没加载出来。请刷新页面，或直接进入 <a href="/python/">萌码 Python</a> / <a href="/en/">萌语岛</a>。</div>';
    return;
  }

  Platform.boot(window.MIAN_SUBJECTS || {}, "lobby").then(renderToday, renderToday);
})();
</script>

<script src="/shared/core/pwa.js?v=3a9ce5f9"></script>
</body>
</html>
